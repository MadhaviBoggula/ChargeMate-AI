services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chargemate-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      HF_HOME: /app/.cache/huggingface
    volumes:
      - huggingface_cache:/app/.cache/huggingface
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  huggingface_cache:
