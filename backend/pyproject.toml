[project]
name = "chargemate-ai-backend"
version = "0.1.0"
description = "ChargeMate AI FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "PyJWT>=2.10.0",
    "pwdlib[argon2]>=0.2.0",
    "email-validator>=2.2.0"
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "pytest-cov>=6.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]