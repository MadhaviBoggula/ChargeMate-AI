[project]
name = "chargemate-ai-backend"
version = "0.1.0"
description = "ChargeMate AI FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "PyJWT>=2.10.0",
    "pwdlib[argon2]>=0.2.0",
    "email-validator>=2.2.0",
    "langgraph==0.2.60",
    "mcp>=1.9.0,<2.0.0",
    "langchain-core==0.3.29",
    "langchain-huggingface==0.1.2",
    "pgvector==0.3.6",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "openai>=1.60.0"
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "pytest-cov>=6.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"